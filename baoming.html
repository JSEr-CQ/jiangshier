<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>十佳歌手大赛 · 报名</title>
<style>
  :root{
    --bg:#05070f;
    --line:rgba(120,160,255,.22);
    --txt:#e8ecff;
    --sub:#8f9ec4;
    --brand:#4d7dff;
    --brand2:#7de2ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--txt);background:var(--bg);
    display:flex;flex-direction:column;
    min-height:100vh;min-height:100dvh;
    overflow-x:hidden;
  }
  .sky{position:fixed;inset:0;z-index:-2;
    background:
      radial-gradient(1200px 700px at 15% 0%, rgba(77,125,255,.30), transparent 60%),
      radial-gradient(900px 600px at 90% 15%, rgba(125,226,255,.16), transparent 60%),
      radial-gradient(700px 700px at 50% 110%, rgba(150,90,255,.22), transparent 60%),
      linear-gradient(180deg,#05070f 0%,#070b18 60%,#04060d 100%);
  }
  .sky::after{
    content:"";position:absolute;inset:-20%;
    background-image:
      radial-gradient(1.4px 1.4px at 20% 30%, #fff 50%, transparent 51%),
      radial-gradient(1.2px 1.2px at 70% 20%, #cfe0ff 50%, transparent 51%),
      radial-gradient(1.6px 1.6px at 40% 75%, #fff 50%, transparent 51%),
      radial-gradient(1.1px 1.1px at 85% 65%, #9fc4ff 50%, transparent 51%),
      radial-gradient(1.3px 1.3px at 12% 82%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 55% 45%, #bfd4ff 50%, transparent 51%),
      radial-gradient(1.2px 1.2px at 92% 88%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 30% 12%, #dbe8ff 50%, transparent 51%);
    background-size:600px 600px,700px 700px,520px 520px,800px 800px,640px 640px,560px 560px,720px 720px,480px 480px;
    opacity:.75;animation:drift 90s linear infinite;
  }
  @keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(-120px,80px,0)}}

  .top{
    flex:0 0 auto;width:100%;max-width:560px;margin:0 auto;
    display:flex;align-items:center;gap:10px;
    padding:18px 16px 10px;
  }
  .logo{
    width:38px;height:38px;border-radius:12px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--brand),var(--brand2));
    display:grid;place-items:center;font-weight:700;letter-spacing:.5px;color:#04101f;
    box-shadow:0 6px 20px rgba(77,125,255,.45);font-size:14px;
  }
  .top h1{margin:0;font-size:17px;letter-spacing:.5px}
  .top p{margin:3px 0 0;font-size:12px;color:var(--sub)}

  .wrap{
    flex:1 1 auto;width:100%;max-width:560px;margin:0 auto;
    padding:4px 12px 14px;display:flex;flex-direction:column;min-height:0;
  }
  .frame{
    flex:1 1 auto;min-height:720px;width:100%;
    background:#fff;border-radius:16px;overflow:hidden;position:relative;
    border:1px solid var(--line);
    box-shadow:0 24px 70px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .frame iframe{display:block;width:100%;height:100%;border:0;background:#fff}

  .alt{
    flex:0 0 auto;margin:10px 2px 0;font-size:12.5px;color:var(--sub);
    text-align:center;line-height:1.7;
  }
  .alt a{color:#9ec6ff;text-decoration:none;border-bottom:1px dashed rgba(158,198,255,.6)}

  /* 电脑端：问卷桌面版太宽，直接在自家页面里放按钮跳转，避免被裁切 */
  .cta{
    display:none;flex:1 1 auto;flex-direction:column;justify-content:center;gap:14px;
    width:100%;padding:28px 20px;border-radius:16px;
    background:rgba(18,24,42,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--line);box-shadow:0 24px 70px rgba(0,0,0,.55);
  }
  .cta h2{margin:0;font-size:16px;letter-spacing:.5px}
  .cta ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--sub);line-height:2.0}
  .btn{
    display:block;text-align:center;text-decoration:none;
    border-radius:14px;padding:15px 18px;font-size:16px;font-weight:600;color:#04101f;
    background:linear-gradient(135deg,var(--brand2),var(--brand));
    box-shadow:0 12px 30px rgba(77,125,255,.35);
  }
  @media (min-width:700px){
    .frame{display:none}
    .cta{display:flex}
    .alt{display:none}
    .wrap{max-width:620px;justify-content:center}
  }

  @media (max-width:420px){
    .top{padding:14px 14px 8px}
    .top h1{font-size:15.5px}
    .frame{min-height:520px;border-radius:14px}
    .wrap{padding:2px 8px 10px}
  }
</style>
</head>
<body>
<div class="sky"></div>

<header class="top">
  <div class="logo">10</div>
  <div>
    <h1>十佳歌手大赛 · 报名</h1>
    <p>小新.help｜扫码填写，后台统一汇总名单</p>
  </div>
</header>

<main class="wrap">
  <div class="frame">
    <iframe id="wj" src="https://wj.qq.com/s2/28747881/kqu1/" title="十佳歌手大赛报名表"
            loading="eager" referrerpolicy="no-referrer-when-downgrade"></iframe>
  </div>
  <p class="alt">
    表内 5 项全部必填：姓名 · 手机号 · 班级 · 参赛歌曲 · 演唱形式（单人/合唱）。<br />
    如果上方报名表没有加载出来，<a href="https://wj.qq.com/s2/28747881/kqu1/" target="_blank" rel="noopener">点这里在新窗口打开填写</a>
  </p>

  <div class="cta">
    <h2>本次报名共 5 项，全部必填</h2>
    <ul>
      <li>姓名 · 手机号（11 位，务必填对，用于通知比赛安排）</li>
      <li>班级（例如：高三（2）班）</li>
      <li>参赛歌曲（填你要唱的歌名）</li>
      <li>演唱形式：单人 / 合唱</li>
    </ul>
    <a class="btn" href="https://wj.qq.com/s2/28747881/kqu1/" target="_blank" rel="noopener">开始填写报名表</a>
  </div>
</main>
</body>
</html>
